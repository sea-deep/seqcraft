<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Inspect plasmids, simulate PCR and restriction digests, compare constructs, and prepare cloning proposals in one exact, private workspace." />
    <meta name="theme-color" content="#0F766E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SeqCraft" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/icon-16x16.png" />
    <link rel="icon" sizes="48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png" />
    <link rel="manifest" href="/icon/site.webmanifest" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SeqCraft" />
    <meta property="og:title" content="SeqCraft — Agent-Native Molecular Biology Workbench" />
    <meta property="og:description" content="Inspect plasmids, simulate PCR and restriction digests, compare constructs, and prepare cloning proposals in one exact, private workspace." />
    <meta property="og:image" content="/icon/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SeqCraft" />
    <meta name="twitter:description" content="Agent-native molecular biology workbench. Local science, optional cloud identity." />
    <meta name="twitter:image" content="/icon/og-image.png" />
    <script>
      (() => {
        const storageKey = 'seqcraft-theme';
        let preference = 'system';

        try {
          const stored = localStorage.getItem(storageKey);
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            preference = stored;
          }
        } catch {
          // Fall back to the system preference when storage is unavailable.
        }

        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const resolvedTheme = preference === 'system'
          ? (prefersDark ? 'dark' : 'light')
          : preference;

        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
